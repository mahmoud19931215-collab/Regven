<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aleppo Space Game</title>
    <style>
        /* إعدادات الشاشة الكاملة للموبايل */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        canvas {
            display: block;
        }

        /* زر تجريبي للتحويل بين الليل والنهار */
        #toggleBtn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            border-radius: 5px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <button id="toggleBtn">تحويل (ليل/نهار)</button>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('toggleBtn');

        let width, height;
        let isDay = true;
        let stars = [];
        let clouds = [];

        // ضبط حجم الشاشة
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initElements();
        }

        // إنشاء النجوم والغيوم
        function initElements() {
            stars = [];
            clouds = [];
            // إنشاء 100 نجمة عشوائية لليل
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5,
                    opacity: Math.random()
                });
            }
            // إنشاء 5 غيوم للنهار
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: Math.random() * (height / 2),
                    speed: 0.2 + Math.random() * 0.5,
                    size: 30 + Math.random() * 20
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            if (isDay) {
                // رسم سماء النهار (أزرق فاتح)
                let grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, "#87CEEB");
                grad.addColorStop(1, "#E0F7FA");
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // رسم الغيوم
                ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
                clouds.forEach(cloud => {
                    ctx.beginPath();
                    ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                    ctx.arc(cloud.x + 25, cloud.y - 10, cloud.size, 0, Math.PI * 2);
                    ctx.arc(cloud.x + 50, cloud.y, cloud.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // تحريك الغيوم
                    cloud.x += cloud.speed;
                    if (cloud.x > width + 100) cloud.x = -100;
                });

            } else {
                // رسم سماء الليل (أسود دافئ)
                let grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, "#050505");
                grad.addColorStop(1, "#1a1a2e");
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // رسم النجوم
                stars.forEach(star => {
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // تأثير لمعان بسيط
                    star.opacity += (Math.random() - 0.5) * 0.05;
                    if (star.opacity < 0) star.opacity = 0;
                    if (star.opacity > 1) star.opacity = 1;
                });

                // رسم القمر
                ctx.fillStyle = "#fdfdfd";
                ctx.shadowBlur = 20;
                ctx.shadowColor = "white";
                ctx.beginPath();
                ctx.arc(width - 80, 80, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0; // إعادة الظل للصفر لبقية العناصر
            }

            requestAnimationFrame(draw);
        }

        // التغيير عند الضغط على الزر
        btn.addEventListener('click', () => {
            isDay = !isDay;
        });

        window.addEventListener('resize', resize);
        resize();
        draw();
    </script>
</body>
</html>
