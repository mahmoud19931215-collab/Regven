<div id="mediaCard" class="media-card-container">
    <video id="cardVideo" class="media-content" playsinline>
        <source src="رابط_الفيديو_هنا" type="video/mp4">
    </video>

    <div class="yt-controls">
        <div class="progress-area" onclick="seekVideo(event)">
            <div id="videoProgress" class="progress-bar"></div>
        </div>

        <div class="buttons-row">
            <button class="yt-btn" onclick="playVideo()">▶️</button>
            <button class="yt-btn" onclick="pauseVideo()">⏸</button>
            
            <div class="volume-container">
                <button class="yt-btn" onclick="toggleMute()">🔊</button>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.1" oninput="changeVolume(this.value)">
            </div>
        </div>
    </div>
</div>
