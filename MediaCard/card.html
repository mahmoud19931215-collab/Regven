<div id="mediaCard" class="media-card-container" style="display: none;">
    <button class="close-card-btn" onclick="closeMediaCard()">إغلاق</button>
    
    <video id="cardVideo" class="media-content" playsinline>
        <source src="رابط_الفيديو_هنا" type="video/mp4">
    </video>

    <div class="controls-container">
        <button class="control-btn" onclick="playVideo()">▶️</button>
        <button class="control-btn" onclick="pauseVideo()">⏸</button>
        <button class="control-btn" onclick="toggleMute()">🔊</button>
    </div>
</div>
