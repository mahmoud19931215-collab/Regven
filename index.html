<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>فضاء حلب</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas { display: block; }
        
        /* تصميم الزر العصري */
        .ui-container {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1000;
        }

        #toggleBtn {
            padding: 15px 35px;
            font-size: 18px;
            font-family: sans-serif;
            font-weight: bold;
            color: white;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        #toggleBtn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="ui-container">
        <button id="toggleBtn">تبديل الوقت</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('toggleBtn');

        let width, height, isDay = false;
        let stars = [], clouds = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initElements();
        }

        function initElements() {
            stars = []; clouds = [];
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.6,
                    opacity: Math.random(),
                    speed: 0.005 + Math.random() * 0.02
                });
            }
            for (let i = 0; i < 6; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: Math.random() * (height / 3),
                    speed: 0.2 + Math.random() * 0.5,
                    size: 35
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            if (isDay) {
                let grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, "#87CEEB");
                grad.addColorStop(1, "#E0F7FA");
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
                clouds.forEach(c => {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.size, 0, Math.PI*2);
                    ctx.arc(c.x+30, c.y-12, c.size, 0, Math.PI*2);
                    ctx.arc(c.x+60, c.y, c.size, 0, Math.PI*2);
                    ctx.fill();
                    c.x += c.speed;
                    if (c.x > width + 100) c.x = -150;
                });
            } else {
                let grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, "#050508");
                grad.addColorStop(1, "#1a1a2e");
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                stars.forEach(s => {
                    s.opacity += s.speed;
                    if (s.opacity > 1 || s.opacity < 0.2) s.speed *= -1;
                    ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                    ctx.fill();
                });

                ctx.fillStyle = "#fff";
                ctx.shadowBlur = 15; ctx.shadowColor = "white";
                ctx.beginPath();
                ctx.arc(width * 0.8, 80, 35, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            requestAnimationFrame(draw);
        }

        // تفعيل الزر
        btn.addEventListener('click', () => {
            isDay = !isDay;
        });

        window.addEventListener('resize', resize);
        resize();
        draw();
    </script>
</body>
</html>
