<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aleppo Space Game - Animated Night</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas { display: block; }
        .controls {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        button {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid white;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button id="toggleBtn">تبديل الجو</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('toggleBtn');

        let width, height, isDay = false; // جعلناه يبدأ بالليل لنرى التأثير
        let stars = [], clouds = [];
        let moonX;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            moonX = width * 0.8; // موقع القمر الابتدائي
            initElements();
        }

        function initElements() {
            stars = []; clouds = [];
            // إنشاء نجوم بخصائص لمعان مختلفة
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.8,
                    opacity: Math.random(),
                    blinkSpeed: 0.01 + Math.random() * 0.03
                });
            }
            // غيوم للنهار
            for (let i = 0; i < 5; i++) {
                clouds.push({
                    x: Math.random() * width,
                    y: Math.random() * (height / 2),
                    speed: 0.2 + Math.random() * 0.4,
                    size: 35
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            if (isDay) {
                // سماء النهار
                let grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, "#87CEEB");
                grad.addColorStop(1, "#B2EBF2");
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // رسم وحركة الغيوم
                ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
                clouds.forEach(c => {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.size, 0, Math.PI*2);
                    ctx.arc(c.x+30, c.y-10, c.size, 0, Math.PI*2);
                    ctx.arc(c.x+60, c.y, c.size, 0, Math.PI*2);
                    ctx.fill();
                    c.x += c.speed;
                    if (c.x > width + 100) c.x = -150;
                });
            } else {
                // سماء الليل الدافئة
                let grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, "#020205");
                grad.addColorStop(1, "#0f0c29");
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // رسم وحركة النجوم (تأثير اللمعان)
                stars.forEach(s => {
                    s.opacity += s.blinkSpeed;
                    if (s.opacity > 1 || s.opacity < 0.2) s.blinkSpeed *= -1;
                    
                    ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                    ctx.fill();
                });

                // رسم وحركة القمر ببطء
                ctx.save();
                ctx.shadowBlur = 25;
                ctx.shadowColor = "rgba(255, 255, 255, 0.5)";
                ctx.fillStyle = "#f5f5f5";
                ctx.beginPath();
                ctx.arc(moonX, 100, 40, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();

                moonX -= 0.05; // سرعة حركة القمر (بطيئة جداً للواقعية)
                if (moonX < -50) moonX = width + 50;
            }

            requestAnimationFrame(draw);
        }

        btn.addEventListener('click', () => isDay = !isDay);
        window.addEventListener('resize', resize);
        
        resize();
        draw();
    </script>
</body>
</html>
